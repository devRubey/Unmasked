name: CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend — Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Run unit tests (pure business logic — no DB/engine required)
        working-directory: backend
        run: mvn -B test -Dtest=MoveAnalysisTest,ExplanationServiceTest,PgnParserServiceTest -DfailIfNoTests=false

      - name: Build backend jar
        working-directory: backend
        run: mvn -B package -DskipTests

  frontend-build:
    name: Frontend — Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker — Build Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t unmasked-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t unmasked-frontend:ci ./frontend

  validate-k8s-manifests:
    name: Kubernetes — Validate Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate manifest structure
        run: |
          python3 - <<'EOF'
          import glob
          import sys
          import yaml

          required_fields = {"apiVersion", "kind", "metadata", "spec"}
          files = sorted(glob.glob("k8s/*.yaml"))

          if not files:
              print("No manifest files found under k8s/")
              sys.exit(1)

          for path in files:
              with open(path) as f:
                  doc = yaml.safe_load(f)

              missing = required_fields - doc.keys()
              if missing:
                  print(f"FAIL: {path} is missing required field(s): {missing}")
                  sys.exit(1)

              print(f"OK: {path} -> {doc['kind']}/{doc['metadata'].get('name')}")

          print(f"\nValidated {len(files)} Kubernetes manifest(s) successfully.")
          EOF
