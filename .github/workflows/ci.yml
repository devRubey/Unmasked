name: CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend — Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
      - name: Run unit tests (pure business logic — no DB/engine required)
        working-directory: backend
        run: mvn -B test -Dtest=MoveAnalysisTest,ExplanationServiceTest,PgnParserServiceTest -DfailIfNoTests=false
      - name: Build backend jar
        working-directory: backend
        run: mvn -B package -DskipTests

  frontend-build:
    name: Frontend — Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker — Build Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t unmasked-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t unmasked-frontend:ci ./frontend

  validate-k8s-manifests:
    name: Kubernetes — Validate Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Validate manifest structure
        run: |
          python3 - <<'EOF'
          import glob
          import sys
          import yaml

          files = sorted(glob.glob("k8s/*.yaml"))
          if not files:
              print("No manifest files found under k8s/")
              sys.exit(1)

          for path in files:
              with open(path) as f:
                  docs = list(yaml.safe_load_all(f))

              for doc in docs:
                  if not doc:
                      continue

                  # 1. Ensure basic required Kubernetes fields exist
                  base_fields = {"apiVersion", "kind", "metadata"}
                  missing_base = base_fields - doc.keys()
                  if missing_base:
                      print(f"FAIL: {path} is missing standard metadata field(s): {missing_base}")
                      sys.exit(1)

                  # 2. Ensure object metadata has a name
                  metadata = doc.get("metadata", {})
                  if not isinstance(metadata, dict) or "name" not in metadata:
                      print(f"FAIL: {path} metadata is missing required 'name' field")
                      sys.exit(1)

                  kind = doc["kind"]
                  name = metadata["name"]

                  # 3. Dynamic payload checks based on resource kind
                  if kind in ["Deployment", "StatefulSet", "DaemonSet", "Job", "CronJob", "Pod"]:
                      if "spec" not in doc:
                          print(f"FAIL: {path} ({kind}/{name}) is missing required 'spec' block")
                          sys.exit(1)
                  elif kind in ["Role", "ClusterRole"]:
                      if "rules" not in doc:
                          print(f"FAIL: {path} ({kind}/{name}) is missing required 'rules' list")
                          sys.exit(1)
                  elif kind in ["RoleBinding", "ClusterRoleBinding"]:
                      # Accept either roleRef or roleref case variations safely
                      has_roleref = any(k.lower() == "roleref" for k in doc.keys())
                      if not has_roleref:
                          print(f"FAIL: {path} ({kind}/{name}) is missing 'roleRef'")
                          sys.exit(1)

                  print(f"OK: {path} -> {kind}/{name}")

          print(f"\nValidated {len(files)} Kubernetes manifest(s) successfully.")
          EOF
