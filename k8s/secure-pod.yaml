apiVersion: v1
kind: Pod
metadata:
  name: unmasked-secure-pod
  namespace: default
spec:
  serviceAccountName: unmasked-sa
  containers:
  - name: verify-container
    image: alpine
    # Prints the LENGTH of each secret, not the value itself - proves injection
    # worked without leaking the real password/secret into CI logs (which the
    # original lab example did - worth avoiding in a real pipeline).
    command:
      - sh
      - -c
      - |
        echo "Unmasked secrets loaded successfully"
        echo "DB password length: ${#DB_PASSWORD}"
        echo "JWT secret length: ${#JWT_SECRET}"
        sleep 3600
    env:
    - name: DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: unmasked-vault
          key: db-password
    - name: JWT_SECRET
      valueFrom:
        secretKeyRef:
          name: unmasked-vault
          key: jwt-secret
