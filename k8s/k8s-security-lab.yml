name: Kubernetes Security Lab

on:
  push:
    branches: [ "main" ]

jobs:
  secure-secrets-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start local Kubernetes cluster
        uses: medyagh/setup-minikube@master

      - name: Create Kubernetes Secret (DB password + JWT secret)
        run: |
          kubectl create secret generic unmasked-vault \
            --from-literal=db-password="${{ secrets.DB_PASSWORD }}" \
            --from-literal=jwt-secret="${{ secrets.JWT_SECRET }}"

      - name: Apply RBAC and Service Account
        run: kubectl apply -f k8s/security-rules.yaml

      - name: Deploy secure verification pod
        run: kubectl apply -f k8s/secure-pod.yaml

      - name: Verify secrets were injected securely
        run: |
          kubectl wait --for=condition=Ready pod/unmasked-secure-pod --timeout=60s
          echo "--- POD LOGS ---"
          kubectl logs unmasked-secure-pod
